name: Validate PR source branch

# Garante que Pull Requests para a branch main só possam vir de:
#   - dev (fluxo normal de integracao)
#   - release/* (cherry-picks e hotfixes aplicados diretamente de main)
# Este job e marcado como required status check na protecao da main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar branch de origem
        run: |
          HEAD="${{ github.head_ref }}"
          if [ "$HEAD" = "dev" ] || [[ "$HEAD" == release/* ]]; then
            echo "Branch de origem valida: $HEAD"
          else
            echo "ERRO: PRs para 'main' so sao aceitos a partir de 'dev' ou 'release/*'."
            echo "Branch de origem detectada: $HEAD"
            exit 1
          fi
