name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          CLICKUP_API_TOKEN: pk_dummy_test_token
        run: pytest test_main.py -v

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check main.py audit.py register_webhook.py
