name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          CLICKUP_API_TOKEN: pk_dummy_test_token
        run: pytest test_main.py -v

      - name: Lint with ruff
        run: |
          # Versao fixada de proposito: sem pin, o CI instala a mais recente do dia e o
          # conjunto de regras default muda entre versoes -- o lint passou a falhar em
          # codigo que nao havia mudado quando o ruff 0.16.0 promoveu novas regras.
          # O conjunto de regras em si vive no ruff.toml.
          pip install ruff==0.16.0
          ruff check .
